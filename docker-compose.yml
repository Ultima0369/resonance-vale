# 灵枢开发环境Docker Compose配置
version: '3.8'

services:
  lingshu-dev:
    build: .
    container_name: lingshu-development
    volumes:
      # 挂载工作空间，实现实时同步
      - .:/workspace
      # 挂载Python包缓存
      - python-packages:/home/developer/.local/lib/python3.11/site-packages
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    stdin_open: true
    tty: true
    # 开发时保持运行
    command: tail -f /dev/null
    
  # 可以添加其他服务
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_PASSWORD: lingshu
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  python-packages:
  # postgres-data: