<!DOCTYPE html>
<html>
<head>
    <title>OpenClaw Control Panel Test</title>
</head>
<body>
    <h1>OpenClaw Control Panel Test</h1>
    
    <div>
        <h2>测试注册功能</h2>
        <p>控制面板地址: <a href="http://127.0.0.1:18789/#token=1b01d5760380654e3d96bada276bb232eb675b1ae609ee8d" target="_blank">点击打开控制面板</a></p>
        
        <h3>已配对的设备:</h3>
        <pre id="devices"></pre>
        
        <h3>尝试创建新配对:</h3>
        <button onclick="testPairing()">测试配对API</button>
        <div id="result"></div>
    </div>
    
    <script>
        async function testPairing() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试...';
            
            try {
                // 尝试访问设备API
                const response = await fetch('http://127.0.0.1:18789/api/devices', {
                    headers: {
                        'Authorization': 'Bearer 1b01d5760380654e3d96bada276bb232eb675b1ae609ee8d'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `错误: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `请求失败: ${error.message}`;
            }
        }
        
        // 加载设备列表
        async function loadDevices() {
            try {
                const response = await fetch('http://127.0.0.1:18789/api/devices', {
                    headers: {
                        'Authorization': 'Bearer 1b01d5760380654e3d96bada276bb232eb675b1ae609ee8d'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('devices').textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error('加载设备列表失败:', error);
            }
        }
        
        // 页面加载时获取设备列表
        window.onload = loadDevices;
    </script>
</body>
</html>
